[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idracauto"
version = "0.2.0"
description = "Captura automatizada de telas de servidores Dell iDRAC (gerações 6, 7, 8 e 9)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Renato Peixoto" }]
keywords = ["idrac", "dell", "playwright", "automacao", "infraestrutura"]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/peixotinho-md/idracauto"

[project.scripts]
idracauto = "idracauto.cli:main"

[tool.setuptools]
packages = ["idracauto"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
